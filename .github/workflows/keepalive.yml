name: keepalive

# GitHub disables scheduled workflows after 60 days with no repository activity.
# The probe commits often, but if it ever stalls this weekly empty commit keeps
# the schedule alive. Belt and suspenders.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "unit01-watcher"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive [skip ci]"
          git push
